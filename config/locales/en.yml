      collection_titles: "Collections"
      earliest_accessioned_date: "Earliest accessioned"
      earliest_accessioned_date_from: 'Earliest accessioned from'
      earliest_accessioned_date_to: 'Earliest accessioned to'
      formats: "Formats"
      include_google_books: "Include Google Books"
      mimetypes: "MIME types"
      mods_resource_types: "MODS resource types"
      released_to_earthworks: "Released to Earthworks"
      released_to_purl_sitemap: "Released to PURL sitemap"
      released_to_searchworks: "Released to Searchworks"
      wps_workflows: "Workflow > Process > Status"
    facet_values:
      ever: "Currently released"
      never: "Not released"
      has_orcids: 'Has contributor ORCIDs'
      has_doi: 'Has DOI'
  edit:
    contents:
      edit:
        title: "Manage files"
        buttons:
          deposit: "Deposit"
          draft: "Save as draft"
      tabs:
        add_files:
          label: "Add files"
        manage_files:
          label: "Manage files"
        deposit:
          label: "Deposit"
    items:
      new:
        title: "Register an item"
        buttons:
          register: 'Register only'
        toasts:
          register: 'Item registered.'
