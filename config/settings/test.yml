solr:
  url: http://localhost:<%= 8983 + (ENV['TEST_ENV_NUMBER'].presence || 1).to_i %>/solr/argo

bulk_actions:
  # Per parallel_rspec process, since each process's test DB reuses the same bulk action ids.
  directory: "tmp/bulk_jobs_test<%= ENV['TEST_ENV_NUMBER'] %>"

# Tests should never publish events to a RabbitMQ instance.
rabbitmq:
  enabled: false

reload_intervals:
  cocina_model: 1000
  bulk_action_show: 500
  bulk_actions_history: 500
  workflow_grid: 500
  multiple_items: 500

mount_locations:
  - <%= Rails.root.join('tmp') %>

globus:
  # Separate from development's tmp/globus, which specs would otherwise delete when cleaning up.
  directory: <%= Rails.root.join('tmp', "globus_test#{ENV['TEST_ENV_NUMBER']}") %>
