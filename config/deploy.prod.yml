# Deploy to the production server.
servers:
  web:
    hosts:
      - argo-b3-prod-a.stanford.edu
  job:
    hosts:
      - argo-b3-prod-a.stanford.edu

# Build natively on the deploy target itself (already has Docker via Puppet)
# rather than emulating amd64 via QEMU on an arm64 developer laptop.
builder:
  remote: ssh://lyberadmin@argo-b3-prod-a.stanford.edu

env:
  clear:
    SETTINGS__SOLR__URL: https://sul-solr.stanford.edu/solr/argo_prod
    SETTINGS__DOR_SERVICES__URL: https://dor-services-prod-lb.stanford.edu
    SETTINGS__PRESERVATION_CATALOG__URL: https://preservation-catalog-prod.stanford.edu
    SETTINGS__STACKS__URL: https://stacks.stanford.edu/image
    SETTINGS__PURL_FETCHER__URL: https://purl-fetcher-prod.stanford.edu

    HONEYBADGER_ENV: prod
